name: CI

on:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve toolchain
        id: toolchain
        env:
          VERSION_LINE: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          case "$VERSION_LINE" in
            2.3.x|2.7.x) echo "java=8" >> "$GITHUB_OUTPUT" ;;
            3.*) echo "java=17" >> "$GITHUB_OUTPUT" ;;
            4.*) echo "java=21" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported version line: $VERSION_LINE" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
          cache: maven
      - name: Configure Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" > "$HOME/.m2/settings.xml"
      - name: Build and verify with the version-line Maven
        env:
          VERSION_LINE: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          if [ "$VERSION_LINE" = "4.1.x" ]; then
            bash mvnw -B --no-transfer-progress clean verify
          else
            mvn -B --no-transfer-progress clean verify
          fi
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14
